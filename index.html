<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bennet Jump – 100 Level</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden;font-family:Arial,sans-serif;touch-action:none}
body{display:grid;place-items:center}
canvas{background:#8fd3ff;display:block;width:min(100vw,960px);height:auto;max-height:100vh;image-rendering:pixelated}
#touch{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 18px;box-sizing:border-box;pointer-events:none}
#touch .group{display:flex;gap:12px;pointer-events:auto}
#touch button{width:68px;height:68px;border:2px solid #222;border-radius:18px;background:rgba(255,255,255,.86);font-size:31px;font-weight:bold;touch-action:none;-webkit-user-select:none;user-select:none}
#touch #jump{width:82px;height:82px;background:rgba(255,212,0,.92)}
#reset{position:fixed;top:12px;right:12px;width:48px;height:42px;border:2px solid #222;border-radius:12px;background:rgba(255,255,255,.82);font-size:22px}
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="touch">
  <div class="group"><button id="left">◀</button><button id="right">▶</button></div>
  <div class="group"><button id="jump">⬆</button></div>
</div>
<button id="reset" aria-label="Neustart">↻</button>

<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
const keys={left:false,right:false,jump:false};
let level=1,score=0,totalCoins=0,lives=3,won=false,levelData;
let p,enemies,coins,coinIds=[],levelStart=0;

const SAVE_KEY="bennetJump100Save";

function makeLevel(n){
  const difficulty=Math.min(10,Math.floor((n-1)/10)+1);
  const platforms=[{x:0,y:470,w:180,h:70}];
  const count=7+Math.min(7,Math.floor(n/12));
  let x=150,y=390;
  for(let i=0;i<count;i++){
    const gap=35+((n*13+i*29)%70);
    const w=105+((n*17+i*11)%85);
    x+=gap;
    if(x+w>920){x=760-(i%3)*70}
    y=290+((n*31+i*47)%150);
    platforms.push({x,y,w,h:22});
  }
  platforms.push({x:870,y:220,w:90,h:22});
  const cs=[];
  for(let i=1;i<platforms.length;i++){
    const q=platforms[i];
    cs.push({x:q.x+q.w/2,y:q.y-28});
  }
  const es=[];
  const enemyCount=Math.min(1+Math.floor(n/8),5);
  for(let i=0;i<enemyCount;i++){
    const q=platforms[1+((i*3+n)%Math.max(1,platforms.length-2))];
    es.push({x:q.x+20,y:q.y-30,w:30,h:30,vx:(i%2?1:-1)*(1.1+difficulty*.12),min:q.x,max:q.x+q.w-30});
  }
  return {platforms,coins:cs,enemies:es,difficulty};
}

function save(){
 localStorage.setItem(SAVE_KEY,JSON.stringify({level,score,totalCoins}));
}
function load(){
 try{
   const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
   if(s){level=Math.max(1,Math.min(100,s.level||1));score=s.score||0;totalCoins=s.totalCoins||0;}
 }catch(e){}
}
function startLevel(n){
 level=Math.max(1,Math.min(100,n));
 levelData=makeLevel(level);
 coins=levelData.coins;
 coinIds=[];
 enemies=levelData.enemies.map(e=>({...e}));
 p={x:55,y:420,w:34,h:46,vx:0,vy:0,on:false};
 lives=3;won=false;levelStart=performance.now();
 save();
}
function resetAll(){
 level=1;score=0;totalCoins=0;
 localStorage.removeItem(SAVE_KEY);
 startLevel(1);
}
function nextLevel(){
 if(level<100){level++;startLevel(level)}
 else {won=true;save();}
}

function bind(id,key){
 const b=document.getElementById(id);
 const on=e=>{e.preventDefault();keys[key]=true};
 const off=e=>{e.preventDefault();keys[key]=false};
 ["touchstart","pointerdown"].forEach(ev=>b.addEventListener(ev,on,{passive:false}));
 ["touchend","touchcancel","pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,off,{passive:false}));
}
bind("left","left");bind("right","right");bind("jump","jump");
document.getElementById("reset").addEventListener("click",resetAll);

function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function loseLife(){
 lives--;
 if(lives<=0){lives=3;p.x=55;p.y=420;p.vy=0;save()}
 else {p.x=55;p.y=420;p.vy=0}
}

function update(){
 if(won)return;
 p.vx=0;
 if(keys.left)p.vx=-4.5;
 if(keys.right)p.vx=4.5;
 if(keys.jump&&p.on){p.vy=-11.5;p.on=false}
 p.vy+=.55;
 const oldBottom=p.y+p.h;
 p.x+=p.vx;
 p.y+=p.vy;
 p.on=false;
 for(const q of levelData.platforms){
   if(p.vy>=0&&p.x+p.w>q.x&&p.x<q.x+q.w&&oldBottom<=q.y&&p.y+p.h>=q.y){
     p.y=q.y-p.h;p.vy=0;p.on=true;
   }
 }
 if(p.x<0)p.x=0;
 if(p.x+p.w>c.width)p.x=c.width-p.w;
 if(p.y>c.height+30)loseLife();

 for(const e of enemies){
   e.x+=e.vx;
   if(e.x<e.min||e.x>e.max)e.vx*=-1;
   if(hit(p,e))loseLife();
 }
 for(let i=0;i<coins.length;i++){
   if(!coinIds.includes(i)&&hit(p,{x:coins[i].x-10,y:coins[i].y-10,w:20,h:20})){
     coinIds.push(i);score++;totalCoins++;save();
   }
 }
 if(p.x>900&&p.y<270)nextLevel();
 if(performance.now()-levelStart>3000)save();
}

function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 ctx.fillStyle="#8fd3ff";ctx.fillRect(0,0,c.width,c.height);
 ctx.fillStyle="#fff";
 [[100,80],[420,110],[700,65]].forEach(([x,y])=>{
   ctx.beginPath();ctx.arc(x,y,25,0,7);ctx.arc(x+30,y,32,0,7);ctx.arc(x+65,y,22,0,7);ctx.fill();
 });
 for(const q of levelData.platforms){
   ctx.fillStyle="#6b3f22";ctx.fillRect(q.x,q.y,q.w,q.h);
   ctx.fillStyle="#42a83f";ctx.fillRect(q.x,q.y,q.w,7);
 }
 // Ziel
 ctx.fillStyle="#333";ctx.fillRect(920,150,5,70);
 ctx.fillStyle="#ffd400";ctx.beginPath();ctx.moveTo(925,150);ctx.lineTo(960,162);ctx.lineTo(925,174);ctx.fill();

 for(let i=0;i<coins.length;i++){
   if(coinIds.includes(i))continue;
   const m=coins[i];ctx.fillStyle="#ffd21a";ctx.beginPath();ctx.arc(m.x,m.y,10,0,7);ctx.fill();
   ctx.fillStyle="#fff2a0";ctx.fillRect(m.x-2,m.y-7,4,14);
 }
 for(const e of enemies){
   ctx.fillStyle="#d52b2b";ctx.fillRect(e.x,e.y,e.w,e.h);
   ctx.fillStyle="#fff";ctx.fillRect(e.x+6,e.y+7,6,6);ctx.fillRect(e.x+19,e.y+7,6,6);
 }
 // Bennet
 ctx.fillStyle="#111";ctx.fillRect(p.x+4,p.y,p.w-8,12);
 ctx.fillStyle="#f1c7a5";ctx.fillRect(p.x+5,p.y+10,p.w-10,14);
 ctx.fillStyle="#ffd21a";ctx.fillRect(p.x,p.y+24,p.w,18);
 ctx.fillStyle="#111";ctx.fillRect(p.x+6,p.y+42,8,4);ctx.fillRect(p.x+21,p.y+42,8,4);

 ctx.fillStyle="#111";ctx.font="bold 22px Arial";ctx.fillText("BENNET JUMP",20,32);
 ctx.font="bold 20px Arial";ctx.fillText("LEVEL "+level+" / 100",20,60);
 ctx.font="18px Arial";ctx.fillText("🪙 "+score+"   ❤️ "+lives,20,86);

 if(won){
   ctx.fillStyle="rgba(0,0,0,.7)";ctx.fillRect(0,0,c.width,c.height);
   ctx.fillStyle="#fff";ctx.textAlign="center";
   ctx.font="bold 52px Arial";ctx.fillText("ALLE 100 LEVEL GESCHAFFT! 🎉",480,230);
   ctx.font="25px Arial";ctx.fillText("Du bist der Bennet-Jump-Champion!",480,280);
   ctx.textAlign="left";
 }
}
load();startLevel(level);
setInterval(save,3000);
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
